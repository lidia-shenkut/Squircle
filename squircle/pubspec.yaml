name: squircle
description: "A private, invite-only social app for close friend groups."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9
  firebase_storage: ^12.4.6
  firebase_messaging: ^15.2.6
  firebase_database: ^11.3.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^15.1.2

  # UI & utilities
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  mime: ^2.0.0
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  timeago: ^3.7.0
  flutter_local_notifications: ^18.0.1
  uuid: ^4.5.1
  rxdart: ^0.28.0
  lottie: ^3.3.1
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  video_player: ^2.11.1
  record: ^5.2.0
  just_audio: ^0.10.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.2
  add_2_calendar: ^3.0.1
  permission_handler: ^11.4.0
  path_provider: ^2.1.6
  dio: ^5.8.0+1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.15
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/images/
    - assets/animations/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
